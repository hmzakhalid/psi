<html lang="en">

<style>
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; cursor: none; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: var(--radius, 8px); overflow: hidden; background: #04050a; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #err { display: none; margin-top: 8px; padding: 10px 12px; background: #2a0b12; color: #ffb3bd; font: 12px ui-monospace, Menlo, monospace; border: 1px solid #7a2233; border-radius: 6px; white-space: pre-wrap; }
  #dbg { display: none; }

<body>
<div id="stage" tabindex="0"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>
<div id="err"></div><pre id="dbg"></pre>
<script>
// ψ core: 2D time-dependent Schrödinger solver on a grid, plus measurement.
// No DOM here, so node can run the same physics to tune levels.
const PSI = (() => {
  const W = 256, H = 144, N = W * H;
  const DT = 0.25;          // time step (ħ = m = dx = 1)
  const PR = 3.2;           // particle radius in cells: a 6-cell slit is too narrow to walk
  const SIGMA = 4.5;        // launch packet width
  const EMPTY = 0, WALL = 1, BARRIER = 2, RED = 3, GREEN = 4, GLASS = 5, MESH = 6; // mesh: waves pass, walkers don't
  const GAMMA = 0.45;       // detector absorption rate at full depth
  const RAMP = 5;           // cells over which detector absorption ramps up

  class World {
    constructor() {
      this.R = new Float32Array(N);      // Re ψ at integer steps
      this.I = new Float32Array(N);      // Im ψ at half steps (Visscher leapfrog)
      this.V = new Float32Array(N);
      this.free = new Float32Array(N);   // 0 inside walls, else 1
      this.kind = new Uint8Array(N);
      this.walk = new Uint8Array(N);     // 1 where the particle's centre may stand
      this.gamFix = new Float32Array(N); // per-cell absorption override (thin tripwires)
      this.redCells = new Int32Array(0); this.redGam = new Float32Array(0);
      this.greenCells = new Int32Array(0); this.greenGam = new Float32Array(0);
      this.sweepers = [];
      this.lastRedCell = -1; this.lastGreenCell = -1;
      this._q = new Int32Array(N); this._seen = new Uint8Array(N);
    }

    reset() {
      this.R.fill(0); this.I.fill(0); this.V.fill(0); this.kind.fill(0); this.gamFix.fill(0);
      this.sweepers = [];
    }
    clearPsi() { this.R.fill(0); this.I.fill(0); }

    fill(kind, x, y, w, h, v = 0) {
      const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
      const x1 = Math.min(W, (x + w) | 0), y1 = Math.min(H, (y + h) | 0);
      for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) {
        const i = yy * W + xx; this.kind[i] = kind; this.V[i] = v;
      }
    }
    wall(x, y, w, h) { this.fill(WALL, x, y, w, h); }
    barrier(x, y, w, h, v) { this.fill(BARRIER, x, y, w, h, v); }
    red(x, y, w, h) { this.fill(RED, x, y, w, h); }
    green(x, y, w, h) { this.fill(GREEN, x, y, w, h); }
    glass(x, y, w, h, v) { this.fill(GLASS, x, y, w, h, v); }
    // thin red tripwire with a fixed absorption rate (no depth ramp)
    wire(x, y, w, h, g) {
      this.fill(RED, x, y, w, h);
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.gamFix[yy * W + xx] = g;
    }
    mesh(x, y, w, h) { this.fill(MESH, x, y, w, h); }
    open(x, y, w, h) { this.fill(EMPTY, x, y, w, h); }
    // filled disc / lens shapes for glass
    disc(kind, cx, cy, r, v = 0) {
      for (let y = Math.max(0, cy - r | 0); y <= Math.min(H - 1, cy + r); y++)
        for (let x = Math.max(0, cx - r | 0); x <= Math.min(W - 1, cx + r); x++)
          if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) { const i = y * W + x; this.kind[i] = kind; this.V[i] = v; }
    }

    finalize() {
      const { kind, free, walk } = this;
      const B = 3;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
        if (x < B || y < B || x >= W - B || y >= H - B) { kind[y * W + x] = WALL; this.V[y * W + x] = 0; }
      for (let i = 0; i < N; i++) free[i] = kind[i] === WALL ? 0 : 1;
      // walkable = no solid cell within PR of the centre
      const r = Math.ceil(PR);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        let ok = 1;
        for (let dy = -r; dy <= r && ok; dy++) for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > PR * PR) continue;
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= W || yy >= H) { ok = 0; break; }
          const k = kind[yy * W + xx];
          if (k === WALL || k === BARRIER || k === MESH) { ok = 0; break; }
        }
        walk[y * W + x] = ok;
      }
      this._zones();
    }

    // detector cells, with absorption ramping up with depth so waves enter instead of bouncing off
    _zones() {
      const { kind } = this, depth = new Int32Array(N).fill(-1), q = this._q;
      let qh = 0, qt = 0;
      for (let i = 0; i < N; i++) if (kind[i] === EMPTY || kind[i] === GLASS || kind[i] === BARRIER || kind[i] === MESH) { depth[i] = 0; q[qt++] = i; }
      while (qh < qt) {
        const i = q[qh++], d = depth[i] + 1, x = i % W;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W];
        for (const j of nb) if (j >= 0 && j < N && depth[j] < 0 && (kind[j] === RED || kind[j] === GREEN)) { depth[j] = d; q[qt++] = j; }
      }
      const build = (K) => {
        const cells = [], gam = [];
        for (let i = 0; i < N; i++) if (kind[i] === K) {
          const d = depth[i] < 0 ? RAMP : depth[i];
          const t = Math.min(1, d / RAMP);
          cells.push(i); gam.push(this.gamFix[i] > 0 ? this.gamFix[i] : GAMMA * t * t);
        }
        return [Int32Array.from(cells), Float32Array.from(gam)];
      };
      [this.redCells, this.redGam] = build(RED);
      [this.greenCells, this.greenGam] = build(GREEN);
    }

    // Gaussian packet with momentum (kx, ky). add=false replaces the field.
    packet(x0, y0, kx, ky, sigma = SIGMA, add = false, phase0 = 0) {
      const { R, I, free } = this;
      if (!add) this.clearPsi();
      // discrete dispersion: E = (1-cos kx) + (1-cos ky)
      const E = (1 - Math.cos(kx)) + (1 - Math.cos(ky));
      const half = -E * DT * 0.5, rad = Math.ceil(sigma * 4.5);
      const s2 = 1 / (4 * sigma * sigma);
      let sum = 0;
      const xa = Math.max(1, Math.floor(x0 - rad)), xb = Math.min(W - 2, Math.ceil(x0 + rad));
      const ya = Math.max(1, Math.floor(y0 - rad)), yb = Math.min(H - 2, Math.ceil(y0 + rad));
      for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
        const i = y * W + x; if (!free[i]) continue;
        const dx = x - x0, dy = y - y0, a = Math.exp(-(dx * dx + dy * dy) * s2);
        const ph = kx * dx + ky * dy + phase0;
        R[i] += a * Math.cos(ph); I[i] += a * Math.sin(ph + half);
        sum += a * a;
      }
      if (!add && sum > 0) {
        const s = 1 / Math.sqrt(sum);
        for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) { const i = y * W + x; R[i] *= s; I[i] *= s; }
      }
    }

    step(n) {
      const { R, I, V, free: M } = this, h = 0.5 * DT;
      for (let s = 0; s < n; s++) {
        for (let y = 1; y < H - 1; y++) {
          let i = y * W + 1;
          for (let x = 1; x < W - 1; x++, i++) {
            const c = I[i];
            R[i] = (R[i] - h * (I[i - 1] + I[i + 1] + I[i - W] + I[i + W] - 4 * c) + DT * V[i] * c) * M[i];
          }
        }
        for (let y = 1; y < H - 1; y++) {
          let i = y * W + 1;
          for (let x = 1; x < W - 1; x++, i++) {
            const c = R[i];
            I[i] = (I[i] + h * (R[i - 1] + R[i + 1] + R[i - W] + R[i + W] - 4 * c) - DT * V[i] * c) * M[i];
          }
        }
      }
    }

    // Detectors soak up amplitude. Returns the norm each colour took during these n steps.
    absorb(n, greenActive = true) {
      const { R, I } = this, t = n * DT;
      let red = 0, green = 0, best = 0;
      const run = (cells, gam, isRed) => {
        let lost = 0; best = 0; let bi = -1;
        for (let j = 0; j < cells.length; j++) {
          const g = gam[j]; if (g === 0) continue;
          const i = cells[j], p = R[i] * R[i] + I[i] * I[i];
          if (p === 0) continue;
          const d = Math.exp(-g * t), l = p * (1 - d * d);
          R[i] *= d; I[i] *= d; lost += l;
          if (l > best) { best = l; bi = i; }
        }
        if (isRed) this.lastRedCell = bi; else this.lastGreenCell = bi;
        return lost;
      };
      red = run(this.redCells, this.redGam, true);
      if (greenActive) green = run(this.greenCells, this.greenGam, false);
      // moving detectors
      for (const s of this.sweepers) {
        const x0 = Math.max(1, s.cx - s.w / 2 | 0), x1 = Math.min(W - 1, s.cx + s.w / 2 | 0);
        const y0 = Math.max(1, s.cy - s.h / 2 | 0), y1 = Math.min(H - 1, s.cy + s.h / 2 | 0);
        let sb = 0;
        for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
          const i = y * W + x; if (!this.free[i]) continue;
          const e = Math.min(x - x0, x1 - 1 - x, y - y0, y1 - 1 - y) + 1;
          const tt = Math.min(1, e / 3), g = GAMMA * tt * tt;
          const p = R[i] * R[i] + I[i] * I[i]; if (p === 0) continue;
          const d = Math.exp(-g * t), l = p * (1 - d * d);
          R[i] *= d; I[i] *= d; red += l;
          if (l > sb) { sb = l; if (l > best || this.lastRedCell < 0) this.lastRedCell = i; }
        }
      }
      return { red, green };
    }

    norm() {
      const { R, I } = this; let s = 0, mx = 0;
      for (let i = 0; i < N; i++) { const p = R[i] * R[i] + I[i] * I[i]; s += p; if (p > mx) mx = p; }
      this.maxDensity = mx;
      return s;
    }
    scale(f) { const { R, I } = this; for (let i = 0; i < N; i++) { R[i] *= f; I[i] *= f; } }

    // lens weight: 1 in the middle, feathered to 0 at radius r
    static lensW(d2, r) {
      const d = Math.sqrt(d2), f = Math.min(5, r * 0.4);
      if (d >= r) return 0; if (d <= r - f) return 1;
      const t = (r - d) / f; return t * t * (3 - 2 * t);
    }
    _lens(cx, cy, r, fn) {
      const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(W - 2, Math.ceil(cx + r));
      const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(H - 2, Math.ceil(cy + r));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const m = World.lensW((x - cx) ** 2 + (y - cy) ** 2, r);
        if (m > 0) fn(y * W + x, m);
      }
    }
    // un-normalised probability mass the lens would find
    lensMass(cx, cy, r) {
      const { R, I } = this; let s = 0;
      this._lens(cx, cy, r, (i, m) => { s += m * (R[i] * R[i] + I[i] * I[i]); });
      return s;
    }
    // "not found here": ψ → sqrt(1-m) ψ
    lensFail(cx, cy, r) {
      const { R, I } = this;
      this._lens(cx, cy, r, (i, m) => { const f = Math.sqrt(1 - m); R[i] *= f; I[i] *= f; });
    }
    // pick a cell ∝ m|ψ|² (lens) or |ψ|² (whole field). u in [0,1)
    sample(u, cx, cy, r) {
      const { R, I } = this;
      if (r === undefined) {
        let tot = 0; for (let i = 0; i < N; i++) tot += R[i] * R[i] + I[i] * I[i];
        let acc = 0, t = u * tot, last = -1;
        for (let i = 0; i < N; i++) { const p = R[i] * R[i] + I[i] * I[i]; if (p > 0) { last = i; acc += p; if (acc >= t) return i; } }
        return last;
      }
      const tot = this.lensMass(cx, cy, r); let acc = 0, t = u * tot, hit = -1, last = -1;
      this._lens(cx, cy, r, (i, m) => {
        if (hit >= 0) return; const p = m * (R[i] * R[i] + I[i] * I[i]);
        if (p > 0) { last = i; acc += p; if (acc >= t) hit = i; }
      });
      return hit >= 0 ? hit : last;
    }
    // nearest standable cell, searching through open space only (never hops a wall)
    nearestWalk(i0) {
      const { walk, kind } = this, q = this._q, seen = this._seen;
      if (i0 < 0) return -1; if (walk[i0]) return i0;
      seen.fill(0); let qh = 0, qt = 0; q[qt++] = i0; seen[i0] = 1;
      while (qh < qt) {
        const i = q[qh++]; if (walk[i]) return i;
        const x = i % W;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W];
        for (const j of nb) if (j >= 0 && j < N && !seen[j] && kind[j] !== WALL) { seen[j] = 1; q[qt++] = j; }
      }
      return -1;
    }
    // cells reachable on foot from i0
    reach(i0) {
      const { walk } = this, q = this._q, out = new Uint8Array(N);
      if (!walk[i0]) return out; let qh = 0, qt = 0; q[qt++] = i0; out[i0] = 1;
      while (qh < qt) {
        const i = q[qh++], x = i % W;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W];
        for (const j of nb) if (j >= 0 && j < N && !out[j] && walk[j]) { out[j] = 1; q[qt++] = j; }
      }
      return out;
    }
  }

  return { W, H, N, DT, PR, SIGMA, EMPTY, WALL, BARRIER, RED, GREEN, GLASS, MESH, GAMMA, World };
})();
if (typeof module !== 'undefined') module.exports = PSI;

// ψ levels. Grid is 256 x 144 cells; finalize() adds a 3-cell border wall.
// Each level: name, hint lines, start, keys, build(world), optional sweepers and coherence seconds.
const PSI_LEVELS = (() => {
  const KMIN = 0.45, KMAX = 1.15, LAUNCH_SIGMA = 5.5, STEPS_PER_SEC = 400;

  const levels = [
    {
      name: 'PARTICLE',
      hint: ['You are a particle. Particles walk.', 'WASD or arrow keys. Reach the green detector.'],
      start: [36, 36], keys: [],
      build(w) {
        w.wall(86, 3, 5, 94);
        w.wall(166, 47, 5, 94);
        w.green(230, 52, 23, 44);
      },
    },
    {
      name: 'WAVE',
      hint: ['These gaps are too narrow to walk through.', 'Aim with the mouse. Hold to charge, release to become a wave.'],
      start: [80, 72], keys: [],
      build(w) {
        w.wall(3, 3, 47, 138); w.wall(50, 3, 72, 41); w.wall(50, 100, 72, 41);
        w.wall(122, 3, 3, 138);
        w.open(122, 53, 3, 6); w.open(122, 69, 3, 6); w.open(122, 85, 3, 6);
        w.green(224, 3, 29, 138);
      },
    },
    {
      name: 'OBSERVER',
      hint: ['The mesh stops walkers, not waves. The exit sleeps until a particle touches the key.', 'As a wave, click where you are brightest. The number is your chance of being found there.'],
      start: [40, 72], keys: [[200, 30]],
      build(w) {
        w.wall(3, 3, 81, 38); w.wall(3, 103, 81, 38);
        w.wall(84, 3, 3, 138);
        w.mesh(84, 41, 3, 62);
        w.wall(168, 52, 30, 5); w.wall(168, 52, 5, 40);
        w.green(228, 98, 25, 36);
      },
    },
    {
      name: 'TUNNEL',
      hint: ['No gap at all, and a red detector behind you.', 'Slow waves bounce back. Hold to full charge and leak straight through.'],
      start: [72, 72], keys: [],
      build(w) {
        w.barrier(126, 3, 4, 138, 0.35);
        w.red(3, 3, 12, 138);
        w.green(226, 3, 27, 138);
      },
    },
    {
      name: 'MIRROR',
      hint: ['The straight line is watched.', 'Walls are mirrors. Bank yourself around it.'],
      start: [38, 72], keys: [],
      build(w) {
        w.mesh(72, 3, 2, 138);
        w.red(116, 40, 22, 64);
        w.green(236, 30, 17, 84);
      },
    },
    {
      name: 'INTERFERENCE',
      hint: ['A tripwire runs down the middle. Meet it head-on and it finds you.', 'Take both channels from an angle, at full charge, until your two halves cancel on the wire.'],
      start: [40, 72], keys: [], coherence: 6,
      spots: [[48, 54], [48, 90]], aimAt: [100, 72],   // shown as a hint after a couple of deaths
      build(w) {
        w.wall(100, 3, 14, 138); w.open(100, 66, 14, 4); w.open(100, 75, 14, 4);
        w.wall(114, 3, 96, 63); w.wall(114, 79, 96, 62);
        w.wire(114, 72, 97, 1, 0.25);
        w.green(228, 3, 25, 138);
      },
    },
    {
      name: 'SCANNER',
      hint: ['The red eye sweeps both gaps.', 'Stand in front of one. Go when it looks away.'],
      start: [50, 72], keys: [],
      sweepers: [{ x: 134, y: 72, w: 12, h: 44, ax: 0, ay: 34, period: 6, phase: 0 }],
      build(w) {
        w.wall(124, 3, 3, 138);
        w.open(124, 35, 3, 6); w.open(124, 103, 3, 6);
        w.wall(150, 66, 76, 12);
        w.green(226, 3, 27, 138);
      },
    },
    {
      name: 'SUPERPOSITION',
      hint: ['Two keys, three rooms, one exit. Everything you have learned.', 'Be everywhere. Be found on purpose.'],
      start: [30, 112], keys: [[24, 22], [245, 34]], coherence: 12,
      sweepers: [{ x: 216, y: 34, w: 30, h: 28, ax: 0, ay: 17, period: 5, phase: 0 }],
      build(w) {
        w.wall(100, 3, 4, 138); w.barrier(100, 22, 4, 32, 0.35);
        w.wall(3, 72, 97, 3); w.open(34, 72, 6, 3); w.open(50, 72, 6, 3); w.open(66, 72, 6, 3);
        w.wall(140, 66, 113, 4);
        w.green(214, 112, 39, 29);
      },
    },
  ];

  function sweep(world, level, t) {
    const src = level.sweepers || [];
    if (world.sweepers.length !== src.length) world.sweepers = src.map(s => ({ cx: s.x, cy: s.y, w: s.w, h: s.h }));
    for (let i = 0; i < src.length; i++) {
      const s = src[i], a = Math.sin(2 * Math.PI * (t / s.period + s.phase));
      world.sweepers[i].cx = s.x + s.ax * a; world.sweepers[i].cy = s.y + s.ay * a;
    }
  }

    world.reset(); level.build(world); world.finalize(); sweep(world, level, 0);
  }
  return { levels, load, sweep, KMIN, KMAX, LAUNCH_SIGMA, STEPS_PER_SEC };
})();
if (typeof module !== 'undefined') module.exports = PSI_LEVELS;

// ψ game: rendering, input, sound, rules. Physics lives in core.js, rooms in levels.js.
(() => {
  'use strict';
  const { W, H, N, PR, World, WALL, BARRIER, RED, GREEN, GLASS, MESH } = PSI;
  const { levels, KMIN, KMAX, LAUNCH_SIGMA, STEPS_PER_SEC } = PSI_LEVELS;
  const Q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  function fail(msg) { document.title = 'ERR ' + msg; const d = $('err'); d.textContent = 'Something broke: ' + msg; d.style.display = 'block'; }
  window.addEventListener('error', e => fail(e.message + ' @' + e.lineno + ':' + e.colno));
  window.addEventListener('unhandledrejection', e => fail('promise: ' + ((e.reason && e.reason.message) || e.reason)));

  // seeded so a test run can be replayed
  let seed = Q.has('seed') ? (+Q.get('seed')) | 0 : (Math.random() * 4294967296) | 0;
  function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  const SPEED = 48, CHARGE_TIME = 1.0, IDLE_SIGMA = 2.6;
  const LENS0 = 10, LENS_MAX = 46, LENS_GROW = 34, COHERENCE = 10;
  const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  const stage = $('stage'); let glc = $('gl'); const uic = $('ui'); const ui = uic.getContext('2d');
  const world = new World();
  const fieldBytes = new Uint8Array(N * 4), levelBytes = new Uint8Array(N * 4), levelBase = new Uint8Array(N * 4);
  const glass = new Uint8Array(N);

  // ---------------------------------------------------------------- renderer
  let gl = null, U = {}, texF = null, texL = null, texG = null, ctx2 = null, off = null, offCtx = null, img = null;
  const PAL_A = [0.55, 0.52, 0.62], PAL_B = [-0.45, 0.36, 0.42], PAL_D = [-0.1, 0.1, -0.1];
  const VS = 'attribute vec2 p; varying vec2 v; void main(){ v=vec2(p.x*0.5+0.5,0.5-p.y*0.5); gl_Position=vec4(p,0.0,1.0); }';
  const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D uF, uL, uG;

      ui.fillStyle = `rgba(90,100,130,${0.5 * a})`; ui.fillRect(x0, y0, bw, 2.2);
      ui.fillStyle = `rgba(90,255,170,${0.95 * a})`; ui.fillRect(x0, y0, bw * Math.min(1, S.fateGreen), 2.2);
      ui.fillStyle = `rgba(255,80,105,${0.95 * a})`; ui.fillRect(x0 + bw * (1 - Math.min(1, S.fateRed)), y0, bw * Math.min(1, S.fateRed), 2.2);
      text('exit ' + pct(S.fateGreen), x0, y0 + 6.2, 2.7, `rgba(140,255,195,${0.9 * a})`, 'left', 700);
      text(pct(S.fateRed) + ' caught', x0 + bw, y0 + 6.2, 2.7, `rgba(255,130,150,${0.9 * a})`, 'right', 700);
      if (S.mode === 'wave') {
        const left = Math.max(0, 1 - S.waveT / (lv.coherence || COHERENCE));
        ui.fillStyle = `rgba(200,210,255,${left < 0.25 ? 0.5 + 0.4 * Math.sin(S.clock * 14) : 0.55})`; ui.fillRect(W / 2 - bw / 2 * left, y0 + 3.2, bw * left, 0.5);
        text('coherence', W / 2, y0 + 6.2, 2.4, 'rgba(180,190,225,0.6)', 'center');
      }
    }
    // hint
    const ha = S.intro < 1 ? S.intro : 1;
    ui.font = `700 ${3.3 * TS}px ${FONT}`; if ('letterSpacing' in ui) ui.letterSpacing = '0.15px';
    const lines = lv.hint, lh = 5.2 * TS, wmax = Math.min(W - 16, Math.max(...lines.map(s => ui.measureText(s).width)));
    pill(W / 2 - wmax / 2 - 5, H - 8.5 - lines.length * lh, wmax + 10, lines.length * lh + 3, `rgba(6,8,18,${0.72 * ha})`);
    lines.forEach((s, i) => { text(s, W / 2, H - 9.4 - (lines.length - 1 - i) * lh, 3.3, i === 0 ? `rgba(240,244,255,${0.95 * ha})` : `rgba(170,185,220,${0.9 * ha})`, 'center', i === 0 ? 700 : 400, 0.15, W - 16); });
    // level card
    if (S.intro < 1.9) {
      const a = Math.min(1, S.intro * 3) * Math.min(1, (1.9 - S.intro) * 1.8);
      text(num, W / 2, H / 2 - 13, 5, `rgba(150,170,215,${0.8 * a})`, 'center', 400, 2);
      text(lv.name, W / 2 + 2, H / 2 - 2, 13, `rgba(255,255,255,${0.92 * a})`, 'center', 700, 4);
    }
    if (S.mode === 'won') {
      const a = Math.min(1, S.modeT * 3);
      text(`${S.levelStats.t.toFixed(1)}s   ${S.levelStats.looks} looks   ${S.levelStats.deaths} deaths`, W / 2, H / 2 + 12, 3.6, `rgba(190,255,220,${0.9 * a})`, 'center', 400, 0.4);
    }
    // nobody should be stranded on one room: after a while, say that it can be skipped
    const stuck = S.levelStats.deaths >= 4 || S.levelStats.t > 75;
    text((snd.muted ? 'R restart · M sound on' : 'R restart · M mute') + (stuck ? ' · ] skip this room' : ''), 8, 14.6, 2.4, stuck ? 'rgba(190,205,240,0.85)' : 'rgba(130,145,180,0.6)', 'left');
  }
  function worlds() {
    const e = -S.stats.logw;
    if (e < 0.05) return 'every world';
    if (e < 6) return '1 in ' + Math.round(Math.pow(10, e)).toLocaleString('en-US') + ' worlds';
    return '1 in 10^' + e.toFixed(1) + ' worlds';
  }
  function drawTitle() {
    drawFx();
    const a = 0.55 + 0.45 * Math.sin(S.clock * 2.4);
    pill(W / 2 - 74, 110, 148, 28, 'rgba(5,7,16,0.62)');
    text('a game about being found', W / 2, 116, 5.2, 'rgba(240,244,255,0.95)', 'center', 700, 1.4);
    text('You are a particle until you choose to be a wave.', W / 2, 124, 3.1, 'rgba(175,190,225,0.9)', 'center', 400, 0.2);
    text('click to begin', W / 2, 132, 3.4, `rgba(150,225,255,${a})`, 'center', 700, 1.2);
    text('a real Schrödinger equation is running behind this text', W / 2, 7, 2.6, 'rgba(165,180,215,0.8)', 'center', 400, 0.3);
  }
  function drawEnd() {
    drawFx();
    const st = S.stats, m = Math.floor(st.time / 60), s = Math.floor(st.time % 60);
    ui.fillStyle = 'rgba(5,7,16,0.84)'; ui.beginPath(); if (ui.roundRect) ui.roundRect(W / 2 - 88, 34, 176, 80, 5); else ui.rect(W / 2 - 88, 34, 176, 80); ui.fill();
    ui.strokeStyle = 'rgba(150,170,230,0.25)'; ui.lineWidth = 0.4; ui.stroke();
    text('YOU WERE FOUND', W / 2 + 2, 48, 10, 'rgba(255,255,255,0.96)', 'center', 700, 3);
    text(`${m}:${String(s).padStart(2, '0')}    ${st.waves} waves    ${st.looks} looks    ${st.deaths} deaths`, W / 2, 62, 3.6, 'rgba(190,255,220,0.92)', 'center', 400, 0.4);
    text('This exact run happens in', W / 2, 75, 3.2, 'rgba(175,190,225,0.9)', 'center');
    text(worlds(), W / 2, 83, 6, 'rgba(150,225,255,0.98)', 'center', 700, 0.8);
    text('Every other you is still out there, somewhere in the wave.', W / 2, 92, 3.2, 'rgba(175,190,225,0.9)', 'center');
    text('click to play again', W / 2, 104, 3.4, `rgba(150,225,255,${0.55 + 0.45 * Math.sin(S.clock * 2.4)})`, 'center', 700, 1.2);
  }

  function render(dt) {
    resize();
    const locked = S.scene === 'play' && !unlocked();
    drawWorld(dt, locked);
    const sc = uic.width / W;
    ui.setTransform(1, 0, 0, 1, 0, 0); ui.clearRect(0, 0, uic.width, uic.height);
    const sh = S.shake * S.shake * 1.6;
    ui.setTransform(sc, 0, 0, sc, (Math.random() - 0.5) * sh * sc, (Math.random() - 0.5) * sh * sc);
    if (S.scene === 'play') drawPlay(); else if (S.scene === 'title') drawTitle(); else drawEnd();
    if (S.trans) { const t = S.trans.t, a = t < 0.35 ? t / 0.35 : 1 - (t - 0.35) / 0.4; ui.setTransform(1, 0, 0, 1, 0, 0); ui.fillStyle = `rgba(4,5,10,${Math.max(0, Math.min(1, a))})`; ui.fillRect(0, 0, uic.width, uic.height); }
  }

  // ---------------------------------------------------------------- input
  let pressTs = -1;
  function press(ts) {
    pressTs = ts >= 0 ? ts : -1;
    snd.start();
    if (S.trans) return;
    if (S.scene === 'title') { begin(); return; }
    if (S.scene === 'end') { go(() => { S.scene = 'title'; buildTitle(); }); return; }
    if (S.mode === 'particle') { S.charging = true; S.chargeT = 0; }
    else if (S.mode === 'wave' && S.lookCd <= 0) { S.lensOn = true; S.lensR = LENS0; }
  }
  function release(ts) {
    const heldMs = ts >= 0 && pressTs >= 0 ? ts - pressTs : -1;
    if (S.scene !== 'play' || S.trans) { S.charging = false; S.lensOn = false; return; }
    if (S.mode === 'particle' && S.charging) launch(heldMs);
    else if (S.mode === 'wave' && S.lensOn) look();
    S.charging = false; S.lensOn = false;
  }
  function pointer(e) { const r = stage.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width * W; my = (e.clientY - r.top) / r.height * H; }
  stage.addEventListener('pointermove', pointer);
  stage.addEventListener('pointerdown', e => { e.preventDefault(); stage.focus(); pointer(e); if (stage.setPointerCapture) try { stage.setPointerCapture(e.pointerId); } catch (err) { } press(e.timeStamp); });
  stage.addEventListener('pointerup', e => { pointer(e); release(e.timeStamp); });
  stage.addEventListener('pointercancel', () => { S.charging = false; S.lensOn = false; });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; e.preventDefault(); snd.start(); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(e.timeStamp); return; }
    if (e.repeat) return;
    if (e.code === 'KeyM') snd.toggle();
    else if (S.scene === 'play' && !S.trans) {
      if (e.code === 'KeyR') go(() => loadLevel(S.lvl));
      else if (e.code === 'BracketRight') nextLevel();
      else if (e.code === 'BracketLeft' && S.lvl > 0) go(() => loadLevel(S.lvl - 1));
    }
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; if (e.code === 'Space' || e.code === 'Enter') release(e.timeStamp); });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; S.charging = false; S.lensOn = false; });
  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------- test hooks (?lvl= ?auto= ?fixed ?stop= ?dbg ?nogl ?seed=)
  const FIXED = Q.has('fixed'), FIXED_DT = 1 / (+Q.get('fixed') || 60), STOP = Q.has('stop') ? +Q.get('stop') : Infinity;
  const script = (Q.get('auto') || '').split(',').filter(Boolean).map(s => { const p = s.split(':'); return { t: +p[0], cmd: p[1], a: p.slice(2) }; }).sort((a, b) => a.t - b.t);
  function runScript() {
    while (script.length && script[0].t <= S.clock) {
      const { cmd, a } = script.shift();
      if (cmd === 'm') { mx = +a[0]; my = +a[1]; }
      else if (cmd === 'd') press(); else if (cmd === 'u') release();
      else if (cmd === 'tp') { S.px = +a[0]; S.py = +a[1]; }
      else if (cmd === 'key') keys[a[0]] = a[1] === '1';
      else if (cmd === 'lvl') loadLevel(+a[0] - 1);
      else if (cmd === 'end') { S.scene = 'end'; buildEnd(); }
      else if (cmd === 'allkeys') S.keys.forEach(k => k.got = true);
    }
  }
  let fpsT = 0, fpsN = 0, fps = 0, costMs = 0, ticksLast = 0;
  function dump() {
    $('dbg').textContent = JSON.stringify({
      scene: S.scene, lvl: S.lvl + 1, mode: S.mode, x: +S.px.toFixed(1), y: +S.py.toFixed(1), clock: +S.clock.toFixed(2),
      norm: +S.norm.toFixed(4), fateGreen: +S.fateGreen.toFixed(3), fateRed: +S.fateRed.toFixed(3), looks: S.stats.looks, deaths: S.stats.deaths,
      keys: S.keys.map(k => k.got), webgl: !!gl, fps: Math.round(fps), frameMs: +costMs.toFixed(2), canvas: glc.width + 'x' + glc.height,
    });
  }
  window.__psi = { S, world, press, release, loadLevel, levels, snd, ticks: () => ticksLast };

  // ---------------------------------------------------------------- boot
  if (!initGL()) initFallback();
  resize();
  if (Q.has('lvl')) { S.scene = 'play'; loadLevel(Math.max(0, Math.min(levels.length - 1, +Q.get('lvl') - 1))); }
  else buildTitle();
  // The game advances in fixed 1/120 s ticks, so walking, charging, the lens and the physics are
  // identical at 30, 60 or 144 Hz. A gap longer than a quarter second is a tab-away and is dropped.
  const TICK = 1 / 120; let tickAcc = TICK / 2;   // start mid-tick so 60 and 120 Hz frames don't sit on a tick boundary
  function advance(dt) {
    tickAcc += dt; let n = 0;
    while (tickAcc >= TICK - 1e-9 && S.clock < STOP) { runScript(); update(TICK); tickAcc -= TICK; if (++n >= 40) { tickAcc = TICK / 2; break; } }
    ticksLast = n;
  }
  if (Q.has('warp')) { const n = +Q.get('warp'); for (let i = 0; i < n && S.clock < STOP; i++) advance(FIXED_DT); }
  let last = 0, frozen = false;
  function frame(now) {
    const raw = (now - last) / 1000; last = now;
    let dt = FIXED ? FIXED_DT : (raw > 0.25 || !(raw >= 0) ? 0 : raw);
    if (S.clock >= STOP) { if (!frozen) { frozen = true; document.title = 'DONE'; } dt = 0; }
    const t0 = performance.now();
    if (!frozen) advance(dt);
    render(dt);
    costMs += (performance.now() - t0 - costMs) * 0.1;
    fpsN++; if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsT = now; fpsN = 0; }
    if (Q.has('dbg')) dump();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();

</script>
</body>
